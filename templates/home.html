<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee Corner{% endblock %}</title>
</head>

<body>

<nav class="navbar">
    <div class="logo">Coffee Corner</div>
    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'places' %}">Shops</a>
        <a href="{% url 'saved' %}">Favorites</a>
        <a href="#">Journal</a>
        <a href="#">Help</a>
        <a href="{% url 'sign_in' %}">Sign In</a>
    </div>
</nav>


<style>
/* Navigation Bar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    background: var(--foam);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}

.navbar .logo {
    font-weight: bold;
    font-size: 1.3rem;
    color: var(--espresso);
}

.navbar .nav-links {
    display: flex;
    gap: 1.5rem;
}

.navbar .nav-links a {
    text-decoration: none;
    color: var(--espresso);
    font-weight: 500;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    transition: background 0.2s, color 0.2s;
}

.navbar .nav-links a:hover {
    background: var(--accent);
    color: white;
}
</style>


<style>
    :root {
    --espresso: #4b2e2b; /* dark brown */
    --accent: #d97941;   /* orange-ish highlight */
    --foam: #f4ede8;     /* light beige */
    }

    body {
        font-family: 'Helvetica Neue', sans-serif;
        background: #fff;
        margin: 0;
        padding: 0;
    }

    .hero-grid {
        display: grid;
        gap: 1.25rem;
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
    }
    .hero-eyebrow {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #a18980;
    }
    .hero-grid h1 {
        margin: 0;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        color: var(--espresso);
    }
    .hero-grid p {
        margin: 0;
        color: #5a4641;
        font-size: 1.05rem;
    }
    .hero-actions {
        display: flex;
        justify-content: center; /* center buttons */
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
    }
    .hero-actions button {
        border: none;
        border-radius: 999px;
        padding: 0.8rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
    }
    .hero-actions .primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 20px 30px rgba(217, 121, 65, 0.35);
    }
    .hero-actions .secondary {
        background: transparent;
        border: 1px solid rgba(75, 46, 43, 0.3);
        color: var(--espresso);
    }
    .quick-prompts {
        display: flex;
        justify-content: center; /* center buttons */
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1.5rem;
    }
    .quick-prompts button {
        border-radius: 999px;
        padding: 0.55rem 1rem;
        border: 1px solid rgba(75, 46, 43, 0.15);
        background: var(--foam);
        color: var(--espresso);
        font-size: 0.9rem;
    }
</style>


{% block content %}
<section class="hero-grid">
    <p class="hero-eyebrow">Launching soon</p>
    <h1>Map every memorable cup.</h1>
    <p>Drop in the copy, imagery, and data wherever you like—Coffee Corner keeps the experience consistent while you explore.</p>
    <div class="hero-actions">
        <button class="primary" type="button">Recommend a shop</button>
        <button class="secondary" type="button">Browse places</button>

    </div>
    <div class="quick-prompts" aria-label="Quick mood prompts">
        <button type="button">Cozy vanilla study</button>
        <button type="button">Quick pick-me-up</button>
        <button type="button">Remote work vibes</button>
        <button type="button">Seasonal treats</button>
    </div>
</section>
{% endblock %}

</body>
</html>
