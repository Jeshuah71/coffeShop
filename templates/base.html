{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coffee Corner{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --espresso: #361f18;
            --latte: #efe1d2;
            --foam: #fffaf4;
            --accent: #d46b42;
            --ink: #0f0a05;
            --border: rgba(75, 46, 43, 0.14);
            --glow: rgba(212, 107, 66, 0.18);
            --radius: 22px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Sora", "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 40% 20%, #fff8ef, #f5ede6 40%, #ede1d5 75%);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            letter-spacing: 0.01em;
        }
        a { color: inherit; }
        button, input, select, textarea {
            font-family: inherit;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.85rem;
            background: rgba(212, 107, 66, 0.12);
            color: var(--espresso);
            border: 1px solid rgba(75, 46, 43, 0.08);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            border-radius: 999px;
            border: 1px solid transparent;
            padding: 0.78rem 1.3rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(120deg, #d46b42, #c4522b);
            color: #fff;
            box-shadow: 0 14px 30px rgba(212, 107, 66, 0.35);
        }
        .btn-ghost {
            border-color: rgba(75, 46, 43, 0.16);
            background: rgba(255, 255, 255, 0.8);
            color: var(--espresso);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            background: var(--foam);
            border: 1px solid rgba(75, 46, 43, 0.12);
            color: #4a312c;
            font-weight: 500;
            font-size: 0.92rem;
        }
        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.25em;
            font-size: 0.75rem;
            color: #8b6f63;
            font-weight: 600;
        }
        .cc-shell {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 3vw, 2rem);
        }
        /* --- Top navigation: full width --- */
        .topbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(53, 34, 14, 0.08);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(9px);
        }
        .topbar__inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.85rem clamp(1.25rem, 3vw, 2rem);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--espresso);
        }
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .logo-text strong {
            letter-spacing: 0.04em;
        }
        .logo-text span {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #7a5a54;
        }
        .primary-nav {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .nav-link {
            text-decoration: none;
            color: var(--espresso);
            padding: 0.55rem 0.95rem;
            border-radius: 999px;
            font-size: 0.95rem;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .nav-link:hover,
        .nav-link:focus-visible {
            background: var(--latte);
            color: var(--accent);
        }
        .nav-link.is-active {
            background: var(--espresso);
            color: white;
            box-shadow: 0 8px 18px rgba(75, 46, 43, 0.25);
        }
        .cta-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .cta-link {
            text-decoration: none;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .cta-link.sign-in {
            border-color: rgba(75, 46, 43, 0.4);
            color: var(--espresso);
        }
        .cta-link.get-started {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 12px 25px rgba(217, 121, 65, 0.35);
        }
        main {
            flex: 1;
            width: 100%;
        }
        .page-surface {
            padding: 0;
        }
        .page-header {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }
        .page-header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            color: var(--espresso);
        }
        .page-header p {
            margin: 0;
            color: #6d554f;
        }
        .page-placeholder {
            border: 2px dashed rgba(75, 46, 43, 0.3);
            border-radius: 20px;
            padding: 2rem;
            background: #fffaf4;
            color: #6d554f;
            font-size: 0.95rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }
        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem;
            background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,250,244,0.9));
            box-shadow: 0 20px 40px rgba(31, 23, 20, 0.08);
        }
        .subtle {
            color: #6d554f;
        }
        /* --- Mobile nav toggle --- */
        .nav-toggle { display: none; }
        .nav-toggle-btn {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-direction: column;
            cursor: pointer;
            background: #fff;
        }
        .nav-toggle-btn span {
            width: 20px;
            height: 2px;
            background: var(--espresso);
        }
        @media (max-width: 820px) {
            .topbar__inner {
                grid-template-columns: auto auto auto;
            }
            .nav-toggle-btn { display: inline-flex; }
            .primary-nav,
            .cta-group {
                grid-column: 1 / -1;
                width: 100%;
                display: none;
                padding: 0.6rem 0;
            }
            .primary-nav { flex-direction: column; }
            .cta-group { justify-content: flex-start; }
            .nav-toggle:checked + .nav-toggle-btn + .primary-nav,
            .nav-toggle:checked + .nav-toggle-btn + .primary-nav + .cta-group {
                display: flex;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar" aria-label="Primary navigation">
        <div class="topbar__inner">
            <a class="logo" href="{% url 'home' %}">
                <div class="logo-text">
                    <strong>Coffee Corner</strong>
                    <span>Every cup, mapped</span>
                </div>
            </a>
            {% with current=request.resolver_match.url_name %}
            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
            <label for="nav-toggle" class="nav-toggle-btn" aria-hidden="true">
                <span></span><span></span><span></span>
            </label>
            <nav class="primary-nav">
                <a href="{% url 'home' %}" class="nav-link{% if current == 'home' %} is-active{% endif %}">Home</a>
                <a href="{% url 'places' %}" class="nav-link{% if current == 'places' %} is-active{% endif %}">Places</a>
                <a href="{% url 'products' %}" class="nav-link{% if current == 'products' %} is-active{% endif %}">Products</a>
                <a href="{% url 'saved' %}" class="nav-link{% if current == 'saved' %} is-active{% endif %}">Saved</a>
                <a href="{% url 'blog' %}" class="nav-link{% if current == 'blog' %} is-active{% endif %}">Blog</a>
                <a href="{% url 'help' %}" class="nav-link{% if current == 'help' %} is-active{% endif %}">Help</a>
                <a href="{% url 'contact' %}" class="nav-link{% if current == 'contact' %} is-active{% endif %}">Contact</a>
            </nav>
            <div class="cta-group">
                <a href="{% url 'signin' %}" class="cta-link sign-in{% if current == 'signin' %} is-active{% endif %}">Sign in</a>
                <a href="{% url 'get_started' %}" class="cta-link get-started{% if current == 'get_started' %} is-active{% endif %}">Get started</a>
            </div>
            {% endwith %}
        </div>
    </header>
    <main style="width:100%;">
        <div class="cc-shell">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
