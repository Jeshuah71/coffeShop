{% extends "base.html" %}

{% block title %}Coffee Corner - Sign up{% endblock %}

{% block content %}
<div class="signup-shell">
    <div class="page-header" style="text-align:center; margin-bottom:1.2rem;">
        <h1>Create your account</h1>
        <p>Save favorites, post journals, and join the coffee stream.</p>
    </div>
    <div class="auth-card">
        <form id="signup-form">
            <div class="form-row">
                <label>Name</label>
                <input type="text" name="name" required placeholder="Your name">
            </div>
            <div class="form-row">
                <label>Email</label>
                <input type="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-row">
                <label>Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="signup-password" required placeholder="••••••••">
                    <button type="button" class="mini-btn" id="toggle-signup-pass">Show</button>
                </div>
            </div>
            <div class="form-row">
                <label>Profile image URL (optional)</label>
                <input type="url" name="avatar_url" placeholder="https://...">
            </div>
            <div id="signup-status" class="subtle" style="color:#8b3b2e;"></div>
            <button class="btn btn-primary" type="submit">Sign up</button>
            <p class="subtle" style="margin:0.6rem 0 0;">Already have an account? <a href="{% url 'signin' %}">Sign in</a></p>
        </form>
    </div>
</div>

<style>
    .signup-shell {
        display: grid;
        place-items: center;
        gap: 0.6rem;
        margin-top: 0.4rem;
    }
    .auth-card {
        border:1px solid var(--border);
        border-radius:16px;
        padding:1rem 1.1rem;
        background:#fff;
        box-shadow:0 18px 32px rgba(31,23,20,0.08);
        max-width:460px;
    }
    .form-row { display:flex; flex-direction:column; gap:0.25rem; }
    .form-row input {
        border:1px solid var(--border);
        border-radius:12px;
        padding:0.7rem 0.85rem;
        font-size:1rem;
    }
    .password-wrap { display:flex; gap:0.4rem; align-items:center; }
    .password-wrap input { flex:1; }
</style>

<script>
(function(){
    const toggleBtn = document.getElementById("toggle-signup-pass");
    const pwd = document.getElementById("signup-password");
    toggleBtn?.addEventListener("click", () => {
        const isText = pwd.type === "text";
        pwd.type = isText ? "password" : "text";
        toggleBtn.textContent = isText ? "Show" : "Hide";
    });
    document.getElementById("signup-form").addEventListener("submit", (ev)=>{
        ev.preventDefault();
        const status = document.getElementById("signup-status");
        status.textContent = "Creating account...";
        const form = ev.target;
        const email = form.email.value.trim();
        const name = form.name.value.trim();
        const payload = {
            email: email,
            password: form.password.value,
            username: name || email.split("@")[0],
            avatar_url: form.avatar_url.value.trim()
        };
        fetch("/api/auth/signup", {
            method:"POST",
            credentials:"include",
            headers:{
                "Content-Type":"application/json",
                "X-CSRFToken": window.getCsrfToken ? window.getCsrfToken() : ""
            },
            body: JSON.stringify(payload)
        }).then(async resp => {
            if(resp.ok){ status.style.color="#2f7a3b"; status.textContent="Account created! Redirecting..."; window.location.href="/"; }
            else {
                const data = await resp.json().catch(()=>({}));
                status.style.color="#8b3b2e";
                status.textContent = data.detail || "Could not sign up.";
            }
        }).catch(() => {
            status.style.color="#8b3b2e";
            status.textContent = "Network error. Try again.";
        });
    });
})();
</script>
{% endblock %}
