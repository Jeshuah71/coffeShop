{% block content %}

<div class="places-container">
    <div id="map" class="map-section"></div>
    <div class="shops-section">
        <!-- Shop cards will go here -->
    </div>
</div>


<!-- Style points yes to make it into 2 columns-->
<style>
.places-container {
    display: flex;
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.map-section {
    flex: 1;
    min-height: 500px; /* temporary height for map */
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.shops-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
</style>

<!-- Google Maps API implementation-->
 <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>


 <!-- Getting user location permissions -->
  <script>
function initMap() {
    // Try to get user's location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
            
            const map = new google.maps.Map(document.getElementById("map"), {
                center: userLocation,
                zoom: 14
            });
            
            const marker = new google.maps.Marker({
                position: userLocation,
                map: map,
                title: "You are here"
            });
            
            // Later: add nearby coffee shop markers here
            
        }, () => {
            alert("Geolocation failed or denied. Showing default location.");
            // fallback location
            const defaultLocation = { lat: 40.7608, lng: -111.8910 }; // Salt Lake City as example
            const map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 14
            });
        });
    } else {
        alert("Your browser does not support geolocation.");
    }
}
window.onload = initMap;
</script>

<!-- Shop cards on the right with heart icon fingers crossed-->
 <div class="shop-card">
    <div class="shop-info">
        <h2>Star Coffee</h2>
        <p>0.5 miles away</p>
    </div>
    <button class="favorite-heart">♥</button>
</div>
<!-- With style points!!!!-->
 <style>
.shop-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    border-radius: 12px;
    background: var(--foam);
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}

.shop-card h2 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--espresso);
}

.shop-card p {
    margin: 0.25rem 0 0;
    color: #5a4641;
}

.favorite-heart {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #d97941;
    transition: transform 0.2s;
}

.favorite-heart:hover {
    transform: scale(1.2);
}
</style>
